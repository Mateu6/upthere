name: Release

# Push a tag like v0.2.0 to publish a release. The DMG and a signed Sparkle
# appcast.xml are attached to the GitHub release; installed apps read
# releases/latest/download/appcast.xml.
#
# Secrets:
#   SPARKLE_ED_PRIVATE_KEY      required: `generate_keys -x key.txt --account dev.upthere.app`
#   DEVELOPER_ID_CERT_P12       optional: base64 Developer ID Application .p12
#   DEVELOPER_ID_CERT_PASSWORD  optional
#   APPLE_TEAM_ID / APPLE_ID / APPLE_APP_PASSWORD   optional, for notarization
#   UPTHERE_SIGNING_P12 / UPTHERE_SIGNING_PASSWORD  base64 .p12 of the stable
#                               self-signed "Upthere Local" identity, used when
#                               there's no Developer ID. Every release keeps the
#                               same signature, so Keychain "Always Allow" holds
#                               across updates.
#   HOMEBREW_TAP_TOKEN          optional: fine-grained token with Contents
#                               read/write on Mateu6/homebrew-tap; bumps the cask

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
      HAS_STABLE_SIGNING: ${{ secrets.UPTHERE_SIGNING_P12 != '' }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      SPARKLE_BIN: build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: brew install xcodegen cmake create-dmg

      - name: Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          printf 'DEVELOPMENT_TEAM = %s\nCODE_SIGN_IDENTITY = Developer ID Application\nENABLE_HARDENED_RUNTIME = YES\nOTHER_CODE_SIGN_FLAGS = --timestamp\n' "$TEAM_ID" > Config/Local.xcconfig

      - name: Import stable signing identity
        if: env.HAS_SIGNING != 'true' && env.HAS_STABLE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.UPTHERE_SIGNING_P12 }}
          CERT_PASSWORD: ${{ secrets.UPTHERE_SIGNING_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security set-keychain-settings build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          printf 'CODE_SIGN_IDENTITY = Upthere Local\n' > Config/Local.xcconfig

      - name: Build
        run: |
          xcodegen generate
          xcodebuild -scheme Upthere -configuration Release -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" build
          ditto build/DerivedData/Build/Products/Release/Upthere.app Upthere.app
          codesign --verify --deep --strict Upthere.app
          codesign -dr - Upthere.app

      - name: Re-sign Sparkle helpers with Developer ID
        if: env.HAS_SIGNING == 'true'
        run: |
          ID="Developer ID Application"
          FW=Upthere.app/Contents/Frameworks/Sparkle.framework
          for item in "$FW"/Versions/B/XPCServices/*.xpc "$FW/Versions/B/Autoupdate" "$FW/Versions/B/Updater.app" "$FW"; do
            codesign -f -s "$ID" -o runtime --timestamp "$item"
          done
          codesign -f -s "$ID" -o runtime --timestamp --entitlements Upthere/Upthere.entitlements Upthere.app
          codesign --verify --deep --strict Upthere.app

      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent Upthere.app Upthere.zip
          xcrun notarytool submit Upthere.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple Upthere.app
          rm Upthere.zip

      - name: Package DMG
        run: |
          mkdir -p updates
          # create-dmg exits non-zero when it can't style the Finder window on a headless runner.
          create-dmg --volname Upthere --app-drop-link 400 120 --window-size 560 300 --icon Upthere.app 160 120 \
            "updates/Upthere-${VERSION}.dmg" Upthere.app || test -f "updates/Upthere-${VERSION}.dmg"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_KEY" || { echo "::error::SPARKLE_ED_PRIVATE_KEY secret is missing"; exit 1; }
          echo "$SPARKLE_KEY" > sparkle.key
          "$SPARKLE_BIN/generate_appcast" --ed-key-file sparkle.key \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            --full-release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            -o updates/appcast.xml updates
          rm sparkle.key
          cat updates/appcast.xml

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            updates/Upthere-*.dmg
            updates/appcast.xml
          generate_release_notes: true

      - name: Update Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA=$(shasum -a 256 "updates/Upthere-${VERSION}.dmg" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Mateu6/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/upthere.rb
          git diff --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "Upthere ${VERSION}" && git push origin HEAD:main
