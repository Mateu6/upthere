name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: brew install xcodegen cmake
      - name: Generate project
        run: xcodegen generate
      - name: Build & test
        run: |
          xcodebuild -scheme Upthere -derivedDataPath build/DerivedData \
            -destination 'platform=macOS' test
