name: Upthere
options:
  bundleIdPrefix: dev.upthere
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Upthere:
    type: application
    platform: macOS
    sources:
      - path: Upthere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.upthere.app
        PRODUCT_NAME: Upthere
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_ENTITLEMENTS: Upthere/Upthere.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Upthere/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Sparkle
      - target: upthere-hook
        embed: true
        codeSign: true
        copy:
          destination: executables
    postCompileScripts:
      - name: Bundle MediaRemote adapter
        script: '"${SRCROOT}/scripts/build-adapter.sh"'
        basedOnDependencyAnalysis: false

  upthere-hook:
    type: tool
    platform: macOS
    sources:
      - path: UpthereHook
    settings:
      base:
        PRODUCT_NAME: upthere-hook
        SWIFT_OPTIMIZATION_LEVEL: -O
        SKIP_INSTALL: YES

  UpthereTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UpthereTests
    dependencies:
      - target: Upthere
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Upthere.app/Contents/MacOS/Upthere"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Upthere:
    build:
      targets:
        Upthere: all
        UpthereTests: [test]
    test:
      targets:
        - UpthereTests
    run:
      config: Debug
